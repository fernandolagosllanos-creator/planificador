[package]
name = "planificador-jira"
version = "0.2.0"
description = "Planificación de proyectos con carta Gantt, integrada con Jira Cloud"
authors = ["Fernando Lagos"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "planificador_jira_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
# Llamadas a la API REST de Jira Cloud (desde Rust, para que el token nunca pase por la vista web).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# Credenciales guardadas en el llavero del sistema (Llavero en Mac, Administrador de credenciales en Windows).
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
