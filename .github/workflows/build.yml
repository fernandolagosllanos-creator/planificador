# Compila los instaladores de Windows y Mac.
# - En cada push a main: pruebas + compilación de verificación (sin publicar).
# - Al crear una etiqueta v* (por ejemplo v0.1.0): publica un GitHub Release con los instaladores.
name: Compilar instaladores

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  instaladores:
    needs: pruebas
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            nombre: mac-apple-silicon
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            nombre: mac-intel
          - platform: windows-latest
            args: ''
            nombre: windows
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Solo publica un Release cuando el push es una etiqueta v*.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && 'v__VERSION__' || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && 'Planificador v__VERSION__' || '' }}
          releaseBody: 'Instaladores de Planificador. Windows: archivo .msi o -setup.exe. Mac: archivo .dmg (Apple Silicon o Intel según tu equipo).'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
      - name: Guardar instaladores como artefactos del flujo
        uses: actions/upload-artifact@v4
        with:
          name: planificador-${{ matrix.nombre }}
          path: |
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: ignore
