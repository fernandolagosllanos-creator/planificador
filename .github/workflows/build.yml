# Compila los instaladores de Windows y Mac de las dos apps del monorepo.
# - En cada push a main y en cada PR: pruebas + compilación de verificación de ambas apps (sin publicar).
# - Al crear una etiqueta simple-v* (por ejemplo simple-v0.3.0): publica un GitHub Release de
#   Planificador simple (apps/simple) con los instaladores, los paquetes de actualización firmados
#   y el manifiesto latest.json que usa el actualizador automático (releases/latest/download).
# - Al crear una etiqueta jira-v* (por ejemplo jira-v0.1.0): lo mismo para Planificador Jira
#   (apps/jira), marcado como pre-release para que no desplace al "latest" del simple; su manifiesto
#   se copia a updates/jira/latest.json en main, que es la URL que consulta esa app.
# El repositorio es un monorepo: packages/core (núcleo compartido) y apps/* (una app por producto).
#
# Secretos necesarios en el repositorio:
#   TAURI_SIGNING_PRIVATE_KEY           clave privada de firma de actualizaciones
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  su contraseña (puede ser vacía)
name: Compilar instaladores

on:
  push:
    branches: [main]
    tags: ['simple-v*', 'jira-v*']
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  # Decide qué apps compilar: la de la etiqueta, o las dos en pushes y PRs.
  preparar:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - id: apps
        run: |
          case "${GITHUB_REF}" in
            refs/tags/simple-v*) echo 'apps=["simple"]' >> "$GITHUB_OUTPUT" ;;
            refs/tags/jira-v*)   echo 'apps=["jira"]'   >> "$GITHUB_OUTPUT" ;;
            *)                   echo 'apps=["simple","jira"]' >> "$GITHUB_OUTPUT" ;;
          esac

  instaladores:
    needs: [pruebas, preparar]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.preparar.outputs.apps) }}
        target: [mac-apple-silicon, mac-intel, windows]
        include:
          - target: mac-apple-silicon
            platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - target: mac-intel
            platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - target: windows
            platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './apps/${{ matrix.app }}/src-tauri -> target'
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/${{ matrix.app }}
          # Solo publica un Release cuando el push es una etiqueta <app>-v*.
          tagName: ${{ startsWith(github.ref, format('refs/tags/{0}-v', matrix.app)) && format('{0}-v__VERSION__', matrix.app) || '' }}
          releaseName: ${{ startsWith(github.ref, format('refs/tags/{0}-v', matrix.app)) && format('Planificador {0} v__VERSION__', matrix.app == 'jira' && 'Jira' || 'simple') || '' }}
          releaseBody: |
            Instaladores de ${{ matrix.app == 'jira' && 'Planificador Jira' || 'Planificador simple' }}.
            - Windows: `..._x.y.z_x64-setup.exe` (o el `.msi`).
            - Mac con chip Apple (M1 en adelante): `..._x.y.z_aarch64.dmg`.
            - Mac con Intel: `..._x.y.z_x64.dmg`.

            Las apps no están firmadas con certificado: en Mac la primera vez ábrela con clic derecho → Abrir; en Windows, "Más información → Ejecutar de todas formas". Las versiones siguientes se instalan solas desde la aplicación.
          releaseDraft: false
          # Los releases de Jira son pre-release: así "latest" sigue siendo el del Planificador simple.
          prerelease: ${{ matrix.app == 'jira' }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}
      - name: Guardar instaladores como artefactos del flujo
        uses: actions/upload-artifact@v4
        with:
          name: planificador-${{ matrix.app }}-${{ matrix.target }}
          path: |
            apps/${{ matrix.app }}/src-tauri/target/**/release/bundle/msi/*.msi
            apps/${{ matrix.app }}/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/${{ matrix.app }}/src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: ignore

  # Planificador Jira no puede usar releases/latest (sería el del simple): el manifiesto de
  # actualización se publica en main, en updates/jira/latest.json.
  manifiesto:
    if: startsWith(github.ref, 'refs/tags/jira-v')
    needs: instaladores
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Copiar el latest.json del release a updates/jira
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p updates/jira
          gh release download "${GITHUB_REF_NAME}" --pattern latest.json --output updates/jira/latest.json --clobber
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/jira/latest.json
          git commit -m "Actualizar manifiesto de Planificador Jira (${GITHUB_REF_NAME}) [skip ci]" || echo "Sin cambios"
          git push origin main
