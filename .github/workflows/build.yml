# Compila los instaladores de Windows y Mac.
# - En cada push a main: pruebas + compilación de verificación (sin publicar).
# - Al crear una etiqueta simple-v* (por ejemplo simple-v0.3.0): publica un GitHub Release
#   de Planificador simple (apps/simple) con los instaladores, los paquetes de actualización
#   firmados y el manifiesto latest.json que usa el actualizador automático.
# El repositorio es un monorepo: packages/core (núcleo compartido) y apps/* (una app por producto).
#
# Secretos necesarios en el repositorio:
#   TAURI_SIGNING_PRIVATE_KEY           clave privada de firma de actualizaciones
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  su contraseña (puede ser vacía)
name: Compilar instaladores

on:
  push:
    branches: [main]
    tags: ['simple-v*']
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  instaladores:
    needs: pruebas
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            nombre: mac-apple-silicon
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            nombre: mac-intel
          - platform: windows-latest
            args: ''
            nombre: windows
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './apps/simple/src-tauri -> target'
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/simple
          # Solo publica un Release cuando el push es una etiqueta simple-v*.
          tagName: ${{ startsWith(github.ref, 'refs/tags/simple-v') && 'simple-v__VERSION__' || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/simple-v') && 'Planificador simple v__VERSION__' || '' }}
          releaseBody: |
            Instaladores de Planificador simple.
            - Windows: `Planificador_x.y.z_x64-setup.exe` (o el `.msi`).
            - Mac con chip Apple (M1 en adelante): `Planificador_x.y.z_aarch64.dmg`.
            - Mac con Intel: `Planificador_x.y.z_x64.dmg`.

            Las apps no están firmadas con certificado: en Mac la primera vez ábrela con clic derecho → Abrir; en Windows, "Más información → Ejecutar de todas formas". Las versiones siguientes se instalan solas desde la aplicación.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
      - name: Guardar instaladores como artefactos del flujo
        uses: actions/upload-artifact@v4
        with:
          name: planificador-${{ matrix.nombre }}
          path: |
            apps/simple/src-tauri/target/**/release/bundle/msi/*.msi
            apps/simple/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/simple/src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: ignore
